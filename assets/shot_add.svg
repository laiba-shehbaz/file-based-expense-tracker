<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 777 553" width="777" height="553"><rect width="777" height="553" rx="12" fill="#0f172a"/><rect width="777" height="38" rx="12" fill="#1e293b"/><rect y="24" width="777" height="14" fill="#1e293b"/><circle cx="22" cy="19" r="6" fill="#ef4444"/><circle cx="42" cy="19" r="6" fill="#f59e0b"/><circle cx="62" cy="19" r="6" fill="#22c55e"/><text x="388.5" y="24" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#94a3b8">Add expense - with input validation</text><text x="24" y="62" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  1. Add expense</text><text x="24" y="81" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  2. List expenses</text><text x="24" y="100" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  3. Edit expense</text><text x="24" y="119" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  4. Delete expense</text><text x="24" y="138" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  5. Monthly totals</text><text x="24" y="157" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  6. Category summary</text><text x="24" y="176" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  7. Export report</text><text x="24" y="195" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  0. Exit</text><text x="24" y="214" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">Choose an option: 1</text><text x="24" y="233" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0"></text><text x="24" y="252" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">➕ Add expense</text><text x="24" y="271" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  Existing categories: Bills, Education, Entertainment, Food, Health, Shopping, Transport</text><text x="24" y="290" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  Amount: abc</text><text x="24" y="309" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#f87171">  ✗ Amount must be a number, e.g. 1250.50</text><text x="24" y="328" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  Amount: -50</text><text x="24" y="347" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#f87171">  ✗ Amount must be greater than zero</text><text x="24" y="366" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  Amount: 1200.505</text><text x="24" y="385" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#f87171">  ✗ Use at most 2 decimal places</text><text x="24" y="404" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  Amount: 1200.50</text><text x="24" y="423" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  Category: Food</text><text x="24" y="442" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  Date (YYYY-MM-DD, Enter = today): 2026-13-45</text><text x="24" y="461" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#f87171">  ✗ Date must be a real date in YYYY-MM-DD format</text><text x="24" y="480" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  Date (YYYY-MM-DD, Enter = today): 2026-11-12</text><text x="24" y="499" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#e2e8f0">  Description (optional): Team lunch</text><text x="24" y="518" xml:space="preserve" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13.5" fill="#4ade80">  ✓ Saved expense #24: Rs 1,200.50 - Food on 2026-11-12</text></svg>